config-version: 8

server:
  host: "127.0.0.1"
  port: 8318

management:
  allow-remote: false
  secret-key: "$2a$10$1pa0cp6Vq2/vxKhbcaP9ZesbPCnELlxbEjg8WhjVXtiaMkh6yupS."

access:
  api-keys:
    - "sk-gemini-proxy-key"

routing:
  strategy: "round-robin"
  session-affinity: false
  retry:
    request-retry: 3
    max-retry-interval: 30

observability:
  logs:
    debug: false
    logging-to-file: false
    request-log: false

requests:
  payload:
    filter:
      - models:
          - name: "*"
            protocol: "antigravity"
        params:
          - "request.systemInstruction"
          - "systemInstruction"

oauth:
  auth-dir: "./auth/codex"
  model-alias:
    antigravity:
      - name: "gemini-3.8-flash-high"
        alias: "gemini-3.8-flash-high"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "gemini-3.8-flash"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "gemini-3.8-flash-tiered"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "gemini-3-flash"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "gpt-4o"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "gpt-4o-mini"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "o3-mini"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "o1"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "o1-mini"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "gpt-4.1"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "gpt-4.5-preview"
        fork: true
      - name: "gemini-3.8-flash-high"
        alias: "gpt-5-codex"
        fork: true
